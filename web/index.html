<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人知识库</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">个人知识库</span>
      <span class="sub">多平台收藏 · 自动分类整理</span>
    </div>
    <div class="search">
      <input id="search" type="text" placeholder="搜索标题 / 标签 / 作者 / 摘要…" autocomplete="off" />
    </div>
    <button id="dash-btn" class="dash-btn">📊 仪表盘</button>
  </header>

  <div class="stats" id="stats"></div>

  <div id="dashboard" class="dashboard" hidden>
    <div class="dash-grid">
      <div class="dash-card" id="dash-platform"></div>
      <div class="dash-card" id="dash-categories"></div>
      <div class="dash-card" id="dash-subcats"></div>
    </div>
    <div class="dash-card" id="dash-review"></div>
  </div>

  <div class="layout" id="layout">
    <aside class="sidebar">
      <div class="side-block">
        <div class="side-title">平台</div>
        <ul class="type-list" id="app-list"></ul>
      </div>
      <div class="side-block">
        <div class="side-title">分类</div>
        <ul id="cat-list" class="cat-list"></ul>
      </div>
      <div class="side-block" id="type-block">
        <div class="side-title">类型</div>
        <ul class="type-list" id="type-list"></ul>
      </div>
      <div class="side-block" id="source-block">
        <div class="side-title">来源</div>
        <ul class="type-list" id="source-list"></ul>
      </div>
      <div class="side-block" id="folder-block" hidden>
        <div class="side-title">收藏夹</div>
        <ul class="type-list" id="folder-list"></ul>
      </div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <span id="toolbar-count">加载中…</span>
        <span class="controls">
          <select id="sort" title="排序">
            <option value="time">最近收藏</option>
            <option value="liked">点赞最多</option>
          </select>
          <button class="btn" id="export-md">导出 Markdown</button>
          <button class="btn" id="export-json">导出 JSON</button>
        </span>
      </div>
      <div id="filter-bar" class="filter-bar" hidden></div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>没有匹配的笔记</div>
    </main>
  </div>

  <div id="detail" class="detail" hidden>
    <div class="detail-card" id="detail-card"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
